<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP STORE | Order Proof</title>

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

/* ===== HEADER ===== */
header {
  text-align: center;
  padding: 36px 20px;
}
header img {
  width: 120px;
  margin-bottom: 12px;
}
header h1 {
  margin: 0;
  font-size: 28px;
}
header p {
  margin-top: 8px;
  color: #9ca3af;
}

/* ===== CONTENT ===== */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* ===== POST CARD ===== */
.post {
  background: #020617;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 0 18px rgba(0,0,0,0.4);
}
.post h3 {
  margin: 6px 0 10px;
  color: #38bdf8;
}
.kd {
  font-size: 13px;
  color: #a5b4fc;
  margin-bottom: 6px;
}
.post p {
  line-height: 1.6;
}
.post a {
  color: #22c55e;
  font-weight: bold;
  text-decoration: none;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  font-size: 13px;
  padding: 20px;
  color: #64748b;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  header h1 {
    font-size: 24px;
  }
  .post {
    padding: 16px;
  }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <img src="file_000000003ef871fa91ea974ef3c18979.png" alt="TP STORE Logo">
  <h1>TP STORE  - PROOF OF DELIVERY </h1>
  <p>Manual Farm • Trusted Seller • International Service</p>
</header>

<!-- ===== POSTS ===== -->
<div class="container" id="posts"></div>

<!-- ===== FOOTER ===== -->
<div class="footer">
© TP STORE — PROOF OF DELIVERY 
</div>

<!-- ===== SCRIPT ===== -->
<script>
/* ================================
   GANTI DENGAN LINK CSV GOOGLE SHEET
   ================================ */
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-7TcK5mzNw7gytjViKlYTkF-g3tHAzZd5uGVhHjknnrWilpsBnZYPHv4J7arck9wd22P5XGTrq5CB/pub?output=csv";

fetch(sheetURL)
  .then(res => res.text())
  .then(data => {
    const rows = data.trim().split("\n").slice(1).reverse(); 
    const posts = document.getElementById("posts");

    rows.forEach(row => {
      const c = row.split(",");
      if (!c[0]) return;

      posts.innerHTML += `
        <div class="post">
          <div class="kd">Kingdom: <b>KD ${c[0]}</b></div>
          <h3>Order Completed ✅</h3>
          <p>
            Resources have been delivered successfully by our manual farm team.<br><br>

            🍖 Food: <b>${c[2]}M</b><br>
            🪵 Wood: <b>${c[3]}M</b><br>
            🪨 Stone: <b>${c[4]}M</b><br>
            🪙 Gold: <b>${c[5]}M</b><br><br>

            📅 Date: <b>${c[1]}</b><br><br>

            🔗 <a href="${c[6]}" target="_blank">View delivery proof</a>
          </p>
        </div>
      `;
    });
  });
</script>

</body>
  </html>
